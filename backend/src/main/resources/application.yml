server:
  port: 8080

spring:
  application:
    name: invistoplus-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/invistoplus
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# H2 configuration for testing (will be used by Testcontainers)
# In test environment, Spring will auto-configure H2 from testcontainers